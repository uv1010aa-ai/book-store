<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="إتمام طلبك من متجر الكتب المستعملة">
<title>إتمام الشراء - متجر الكتب المستعملة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">
    <h1>📚 متجر الكتب المستعملة</h1>
    <p>إتمام طلبك بسهولة</p>
  </div>
</header>
<a href="https://wa.me/9665XXXXXXXX" target="_blank">
  تواصل معي عبر واتساب
</a>
<main class="checkout">
  <h2>🛒 إتمام الشراء</h2>
  <a href="index.html" class="back-home">🏠 العودة للصفحة الرئيسية</a>

  <form id="checkout-form">
    <label for="name">الاسم الكامل</label>
    <input type="text" id="name" name="name" placeholder="اكتب اسمك" autocomplete="name" required>

    <label for="phone">رقم الجوال</label>
    <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" autocomplete="tel" inputmode="tel" required>

    <label for="address">العنوان</label>
    <textarea id="address" name="address" placeholder="اكتب عنوان التوصيل" autocomplete="street-address" required></textarea>

    <label for="payment">طريقة الدفع</label>
    <select id="payment" name="payment">
      <option>الدفع عند الاستلام</option>
      <option>تحويل بنكي</option>
    </select>

    <div class="order-box">
      <h3>ملخص الطلب</h3>
      <p>عدد الكتب: <span id="order-count">0</span></p>
      <p>الإجمالي: <span id="order-total">0.00 ر.س</span></p>
    </div>

    <button type="submit" class="checkout-btn">✅ تأكيد الطلب</button>
    <p id="checkout-message" role="alert" aria-live="polite"></p>
  </form>
</main>

<footer><p>© 2026 متجر الكتب المستعملة</p></footer>
<script src="checkout.js"></script>
</body>
</html>
